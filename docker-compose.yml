version: '3.8'
services:
  backend:
    build: ./backend
    container_name: slimkit-backend
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: slimkit-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
